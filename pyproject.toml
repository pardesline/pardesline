[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pardesline"
dynamic = ["version"]
description = "3D computer vision and medical imaging in Python: 43 public 3D and medical datasets loaded in one line with manifests and licences, 73 algorithms on point clouds, meshes and CT/MRI volumes (registration, segmentation, reconstruction), one typed object over Open3D, PyVista and SimpleITK, and an MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jonathan Tabet" }]
maintainers = [{ name = "PardesLine" }]
keywords = [
    "3d", "3d-vision", "computer-vision", "medical-imaging", "point-cloud", "mesh",
    "volume", "ct", "mri", "dicom", "nifti", "datasets", "dataset-loader", "huggingface",
    "registration", "icp", "segmentation", "3d-reconstruction", "lidar", "gaussian-splatting",
    "open3d", "pyvista", "simpleitk", "deep-learning", "mcp", "mcp-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Core: catalog, object model, runner and the cloud client. No native libraries.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "loguru>=0.7,<1",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
# Point clouds, meshes, SDF, LiDAR, stereo (Open3D 0.20 ships wheels for 3.10-3.13; 0.19 for 3.10-3.12).
local = [
    "open3d>=0.18,<0.21",
    "pyvista>=0.43,<1",
    "scipy>=1.10,<2",
    "scikit-image>=0.21,<1",
    "matplotlib>=3.7,<4",
    "pycpd>=2,<3",
]
# Volumes, DICOM series, registration and segmentation (VTI/VTU volumes go through PyVista).
medical = [
    "SimpleITK>=2.3,<3",
    "pyvista>=0.43,<1",
]
# Datasets hosted on the Hugging Face Hub (pl.load("hf://...")).
hf = [
    "huggingface_hub>=0.24,<3",
]
# The local MCP server (`pardesline mcp`) for Claude, Gemini, Cursor, Codex and any MCP client.
mcp = [
    "mcp>=1.2,<2",
]
all = ["pardesline[local,medical,hf,mcp]"]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.17,<0.18",
    "build>=1",
]

[project.urls]
Homepage = "https://pardesline.github.io/pardesline/"
Documentation = "https://pardesline.github.io/pardesline/"
Repository = "https://github.com/pardesline/pardesline"
Changelog = "https://github.com/pardesline/pardesline/blob/main/CHANGELOG.md"
Issues = "https://github.com/pardesline/pardesline/issues"
Discussions = "https://github.com/pardesline/pardesline/discussions"
Showcase = "https://github.com/pardesline/pardesline/blob/main/docs/showcase/README.md"
Company = "https://pardesline.com"
Platform = "https://appbeta.pardesline.com"

[project.scripts]
pardesline = "pardesline.cli:main"

[tool.hatch.version]
path = "src/pardesline/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pardesline"]

# The expert skills ship inside the wheel so `pardesline mcp` can serve them to any agent.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "pardesline/skills"

[tool.hatch.build.targets.sdist]
include = ["src/pardesline", "tests", "skills", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "local: needs the [local] extra (Open3D, PyVista)",
    "medical: needs the [medical] extra (SimpleITK)",
    "slow: takes more than a few seconds",
    "network: downloads real data (set PARDESLINE_NETWORK_TESTS=1 to run)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# Migrated code is kept byte-identical to its source of truth (the platform's
# modules/ scripts and the 0.1.0 client) until the platform depends on this
# package. Lint and format apply to the new code only.
exclude = [
    "src/pardesline/ops",
    "src/pardesline/cloud",
    "src/pardesline/medical/_service.py",
    "src/pardesline/medical/pyvista_adapter.py",
    "tests/cloud",
    # Generated documentation pages (docs/_gen/*.py rewrites them at build time).
    "docs/datasets",
    "docs/algorithms",
    "docs/models",
    "docs/guides",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Reference scripts shipped with the skills favour readable one-liners over the 110-column rule.
"skills/**/*.py" = ["E501", "B905", "B007", "SIM115", "RUF005", "RUF007", "RUF046", "RUF059", "F401", "F841", "E741", "UP"]
# Examples are read top to bottom like a notebook: long usage lines and late imports are deliberate.
"examples/**/*.py" = ["E501", "E402"]
# Benchmarks and docs generators carry long Markdown strings on purpose.
"benchmarks/**/*.py" = ["E501"]
"docs/_gen/**/*.py" = ["E501"]
"docs/seo/*.py" = ["E501"]
"templates/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pardesline"]
