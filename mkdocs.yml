site_name: pardesline
site_description: 3D computer vision and medical imaging in Python — datasets in one line, algorithms with defaults that work on real scans, models, MCP for AI agents.
site_url: https://pardesline.github.io/pardesline/
repo_url: https://github.com/pardesline/pardesline
repo_name: pardesline/pardesline
edit_uri: edit/main/docs/
copyright: Apache-2.0 · PardesLine
docs_dir: docs
site_dir: site
strict: true

exclude_docs: |
  _gen/
  seo/

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pardesline/pardesline
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pardesline/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/pardesline

plugins:
  - search
  - mike:
      alias_type: copy
  - gen-files:
      scripts:
        - docs/_gen/mkdocs_hook.py
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
  - social:
      enabled: !ENV [DOCS_SOCIAL, false]
      cards_layout_options:
        background_color: "#151a24"
        color: "#e8ecf2"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

