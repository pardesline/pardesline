name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "ruff>=0.17,<0.18"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[hf,mcp]" mypy
      - run: python -m mypy src/pardesline

  test-core:
    # The core package (catalog, object model, datasets, MCP) has no native deps:
    # it must import and pass on every supported interpreter, 3.13 included.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not local and not medical" --cov=pardesline --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: core
          fail_ci_if_error: false

  test-local:
    # Full run with the native libraries (Open3D 0.20 ships wheels for 3.10-3.13).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for Open3D / VTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libgomp1 libxrender1 libsm6 libusb-1.0-0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m pytest -q --cov=pardesline --cov-report=xml
        env:
          PYVISTA_OFF_SCREEN: "true"
      - uses: codecov/codecov-action@v7
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: full
          fail_ci_if_error: false

  readme-demo:
    # The README 30-second demo and the documented how-to code blocks run as written,
    # against the live datasets (19 MB RIRE, 28 MB hippocampus, 3 MB bunny).
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libgomp1 libxrender1 libsm6 libusb-1.0-0 xvfb
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]"
      - name: Run the README, tutorial and how-to code blocks
        run: xvfb-run -a python -m pytest -q tests/test_docs_snippets.py
        env:
          PARDESLINE_NETWORK_TESTS: "1"
          PYVISTA_OFF_SCREEN: "true"
      - name: Run the README demo script
        run: xvfb-run -a python examples/register_ct_mr_rire/run.py
        env:
          PYVISTA_OFF_SCREEN: "true"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test-core]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
