name: Nightly install from PyPI

# Every night: install the released package from PyPI into a fresh interpreter and
# run the README 30-second demo. Catches wheel, dependency and dataset-source
# regressions that a repository checkout would hide.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libgomp1 libxrender1 libsm6 libusb-1.0-0 xvfb
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pardesline[all]"
      - run: |
          python -c "import pardesline as pl; print(pl.__version__, len(pl.datasets()), 'datasets', len(pl.modules()), 'modules')"
          pardesline datasets
          pardesline list
      - name: README demo (RIRE CT/MR registration)
        shell: python
        run: |
          import os, time
          os.environ["PYVISTA_OFF_SCREEN"] = "true"
          import pardesline as pl
          t0 = time.time()
          s = pl.load("rire_brain")[0]
          moved = s.ct.align(s.mr_t1)
          rot = moved.transform["sub_transforms"][0]["rotation_deg"]
          print("rotation_deg", rot, "seconds", round(time.time() - t0, 1))
          assert abs(rot[2]) > 3, rot  # the known ~4 degree rotation about z was found
          moved.save("mr_on_ct.nii.gz")
