name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/pardesline/**"
      - "skills/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
      - ".github/pages/**"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/pardesline/**"
      - "skills/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy as a versioned site (empty: deploy main as dev)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

# One queue per target: GitHub keeps a single pending run per group, so a release deploy that shared
# the main queue was dropped when a later push to main queued behind it (v0.5.0, 2026-11-16).
# Release / dispatched-tag deploys get their own group; the deploy steps retry if both push at once.
concurrency:
  group: docs-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System libraries for the social cards
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[hf,mcp]" "mkdocs-material[imaging]>=9.5" "mkdocstrings[python]>=0.26" mkdocs-gen-files mike
      - name: Build (strict)
        run: mkdocs build --strict
        env:
          DOCS_SOCIAL: "true"
      # Informational (fail: false). github.com answers hundreds of repo links with 5-minute
      # rate-limit backoffs that stalled the build; those links are excluded and the step is capped.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        timeout-minutes: 8
        continue-on-error: true
        with:
          args: --no-progress --accept 200,206,429 --max-retries 1 --timeout 20 --exclude-path site/assets --exclude 'localhost' --exclude 'pardesline.com' --exclude 'linkedin.com' --exclude 'pypistats' --exclude '^https://github\.com/' --exclude 'creatis\.insa-lyon\.fr' --max-concurrency 8 'site/**/*.html'
          fail: false
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[hf,mcp]" "mkdocs-material[imaging]>=9.5" "mkdocstrings[python]>=0.26" mkdocs-gen-files mike
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # retry CMD...: run, and on failure (gh-pages moved under us) resync gh-pages and run again
          cat > "$RUNNER_TEMP/retry.sh" <<'SH'
          for attempt in 1 2 3; do
            "$@" && exit 0
            echo "attempt $attempt failed; resyncing gh-pages" >&2
            sleep $((attempt * 15))
            git fetch origin gh-pages && git branch -f gh-pages origin/gh-pages
          done
          exit 1
          SH
      # main is "dev"; "latest" stays on the last release (moved only by the step below)
      - name: Deploy dev docs (push to main)
        if: github.event_name != 'release' && (inputs.tag || '') == ''
        run: bash "$RUNNER_TEMP/retry.sh" mike deploy --push --alias-type copy dev
        env:
          DOCS_SOCIAL: "true"
      - name: Deploy versioned docs (release or dispatched tag)
        if: github.event_name == 'release' || (inputs.tag || '') != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DOCS_SOCIAL: "true"
        run: |
          VERSION="${TAG#v}"
          MINOR="${VERSION%.*}"
          bash "$RUNNER_TEMP/retry.sh" mike deploy --push --update-aliases --alias-type copy "$MINOR" latest
          bash "$RUNNER_TEMP/retry.sh" mike set-default --push latest
      # Unversioned links (/pardesline/datasets/x/) land on the same page under /latest/
      - name: Root 404 page
        run: |
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          git show origin/main:.github/pages/404.html > "$RUNNER_TEMP/gh-pages/404.html"
          cd "$RUNNER_TEMP/gh-pages"
          git add 404.html
          if ! git diff --cached --quiet; then
            git commit -m "Root 404 page: send unversioned links to latest"
            git pull --rebase origin gh-pages && git push origin gh-pages
          fi
