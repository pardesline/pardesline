name: Publish to PyPI

# Trusted Publishing: configure the `pardesline` project on PyPI with this
# repository + workflow name + environment `pypi`. No API token is stored.
#
# A release created by Release Please (with the workflow token) does not fire
# the `release` event, so release-please.yml dispatches this workflow with the
# tag as input. The `release` trigger stays for releases created by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example v0.3.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # 0.2.0 was uploaded with twine; a release of an already-published version must not fail
