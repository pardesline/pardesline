<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · pardesline</title>
  <!--
    Root 404 page of the gh-pages branch (copied there by .github/workflows/docs.yml).
    The site is versioned by mike: pages live under /pardesline/<version>/.
    An unversioned link (/pardesline/datasets/amos22/, as printed on PyPI 0.3.0)
    or a link into a removed tag folder (/pardesline/v0.3.0/...) is sent to the
    same page under /pardesline/latest/. A miss inside a real version stays here.
  -->
  <script>
    (function () {
      var base = "/pardesline/";
      var path = window.location.pathname;
      if (path.indexOf(base) !== 0) return;
      var rest = path.slice(base.length);
      var first = rest.split("/")[0];
      if (/^v\d+(\.\d+)*$/.test(first)) {
        rest = rest.slice(first.length + 1);
      } else if (/^(latest|dev|\d+\.\d+)$/.test(first)) {
        return;
      }
      window.location.replace(base + "latest/" + rest + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    :root { --bg: #ffffff; --fg: #1f2430; --muted: #5b6372; --accent: #e8590c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151a24; --fg: #e8ecf2; --muted: #9aa3b2; --accent: #f0a05a; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 40rem; margin: 18vh auto 0; padding: 0 16px; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This page does not exist in this version of the pardesline documentation.</p>
    <p><a href="/pardesline/latest/">Documentation home</a> ·
      <a href="/pardesline/latest/datasets/">Datasets</a> ·
      <a href="/pardesline/latest/algorithms/">Algorithms</a> ·
      <a href="https://github.com/pardesline/pardesline">GitHub</a></p>
  </main>
</body>
</html>
