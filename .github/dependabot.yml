version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  # Library: lower bounds stay loose on purpose (Open3D 0.19 users, numpy 1.x).
  # Version-bump PRs are off; security updates still open PRs.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 0
